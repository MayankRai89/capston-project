apiVersion: v1
kind: Pod
metadata:
  name: sandbox-pod
  labels:
    app: sandbox
spec:
  serviceAccountName: sandbox-sa
  containers:
    - name: sandbox
      image: sandbox:v1
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 3000
      env:
        - name: PORT
          value: "3000"
      livenessProbe:
        httpGet:
          path: /api/sandbox/health
          port: 3000
        initialDelaySeconds: 10
        periodSeconds: 10
      readinessProbe:
        httpGet:
          path: /api/sandbox/health
          port: 3000
        initialDelaySeconds: 10
        periodSeconds: 10
      resources:
        limits:
          cpu: "100m"
          memory: "128Mi"
        requests:
          cpu: "100m"
          memory: "128Mi"
